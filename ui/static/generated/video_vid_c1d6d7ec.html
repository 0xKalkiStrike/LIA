    .caption-box { background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); padding: 14px 24px; border-radius: 12px; color: #fff; font-size: 16px; text-align: center; border: 1px solid rgba(255,255,255,0.15); line-height: 1.5; max-height: 100px; overflow-y: auto; max-width: 860px; margin: 0 auto; }

  <script>
    const scenes = [{"scene": 1, "title": "Opening View", "visual": "Cinematic wide establishing shot showing Car In Which It Will with glowing particle effects, 2k QHD resolution.", "duration": "00:06", "audio": "Welcome to the video presentation of Car In Which It Will. Let's step into this visual experience.", "image_url": "/static/generated/video_vid_c1d6d7ec_s1.jpg"}, {"scene": 2, "title": "Main Highlight", "visual": "Dynamic camera zoom into key details of Car In Which It Will, smooth panning across vivid surroundings.", "duration": "00:07", "audio": "Exploring the main visual details and fine features of Car In Which It Will.", "image_url": "/static/generated/video_vid_c1d6d7ec_s2.jpg"}, {"scene": 3, "title": "Cinematic Conclusion", "visual": "Futuristic cinematic closing shot of Car In Which It Will, lighting up with dramatic atmosphere.", "duration": "00:07", "audio": "This completes our visual presentation of Car In Which It Will.", "image_url": "/static/generated/video_vid_c1d6d7ec_s3.jpg"}];
    let curIdx = 0, isPlaying = false, timer = null;
    const vImg = document.getElementById('v-img');
    const vTag = document.getElementById('v-tag');
    const vCap = document.getElementById('v-caption');
    const vProg = document.getElementById('v-prog');
    const vPlay = document.getElementById('v-play');
    const vChips = document.getElementById('v-chips');

    function renderChips() {
      if (!vChips) return;
      vChips.innerHTML = scenes.map((s, i) => `
        <button class="chip ${i === curIdx ? 'active' : ''}" onclick="jumpScene(${i})" title="${s.title}">
          🎬 Scene ${s.scene}: ${s.title}
        </button>
      `).join('');
    }

    function jumpScene(idx) {
      curIdx = idx;
      const s = scenes[curIdx];
      if (vTag) vTag.textContent = `Scene ${s.scene}: ${s.title}`;
      if (vCap) vCap.textContent = s.audio;
      if (vImg && s.image_url) {
        vImg.src = s.image_url;
      }
      if (vProg) vProg.style.width = `${((curIdx + 1) / scenes.length) * 100}%`;
      renderChips();
      if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        if (isPlaying && s.audio) {
          const ut = new SpeechSynthesisUtterance(s.audio);
          speechSynthesis.speak(ut);
        }
      }
    }

    if (vPlay) {
      vPlay.onclick = () => {
        isPlaying = !isPlaying;
        vPlay.textContent = isPlaying ? '⏸' : '▶';
        if (vImg) vImg.classList.toggle('playing', isPlaying);
        if (isPlaying) {
          jumpScene(curIdx);
          let step = 0;
          clearInterval(timer);
          timer = setInterval(() => {
            step += 1;
            if (vProg) vProg.style.width = `${Math.min(100, ((curIdx * 20 + step) / (scenes.length * 20)) * 100)}%`;
            if (step >= 20) {
              step = 0;
              curIdx = (curIdx + 1) % scenes.length;
              jumpScene(curIdx);
            }
          }, 400);
        } else {
          clearInterval(timer);
          if ('speechSynthesis' in window) speechSynthesis.cancel();
        }
      };
    }

    renderChips();
  </script>
