<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LIA — Local AI Assistant</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/static/console/console.css?v=1">
</head>
<body>

<!-- Auth -->
<main id="auth" class="auth" hidden>
  <form id="auth-form" class="card auth-card" autocomplete="on">
    <div class="brand"><span class="logo">L</span><h1>LIA</h1></div>
    <p class="muted" id="auth-sub">Sign in to your local assistant.</p>
    <label>Username<input id="a-user" required autocomplete="username"></label>
    <label id="a-name-wrap" hidden>Display name<input id="a-name" autocomplete="name"></label>
    <label>Secret word<input id="a-pass" type="password" required autocomplete="current-password"></label>
    <p class="error" id="auth-err" role="alert"></p>
    <button class="btn primary" id="auth-btn" type="submit">Sign in</button>
    <button class="btn link" id="auth-toggle" type="button">Create an account</button>
  </form>
</main>

<!-- App -->
<div id="app" class="app" hidden>
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar" aria-label="Settings">
    <div class="brand"><span class="logo">L</span><h1>LIA</h1><span class="dot" id="status-dot" title="Ollama status"></span></div>
    <button class="btn primary block" id="new-chat">+ New chat</button>

    <section>
      <h2>Model</h2>
      <select id="model" aria-label="Model"></select>
      <p class="muted small" id="model-hint"></p>
    </section>

    <section>
      <h2>Autonomy</h2>
      <select id="autonomy" aria-label="Autonomy">
        <option value="ask">Ask before risky actions</option>
        <option value="auto">Run everything automatically</option>
      </select>
    </section>

    <section class="grow">
      <h2>Abilities</h2>
      <ul class="tools" id="tool-list"></ul>
    </section>

    <section class="foot">
      <label class="switch"><input type="checkbox" id="speak"> <span>Read replies aloud</span></label>
      <button class="btn ghost block" id="theme">Toggle theme</button>
      <button class="btn ghost block" id="clear-hist">Clear history</button>
      <a class="btn ghost block" href="/classic">3D avatar mode</a>
      <button class="btn ghost block" id="logout">Sign out</button>
    </section>
  </aside>

  <section class="main">
    <header class="topbar">
      <button class="icon" id="menu" aria-label="Open menu">☰</button>
      <div class="title"><strong id="who">LIA</strong><span class="muted small" id="model-badge"></span></div>
    </header>

    <div class="chat" id="chat" role="log" aria-live="polite">
      <div class="welcome" id="welcome">
        <h2>What can I do for you?</h2>
        <p class="muted">I run on your own computer with Ollama. I can search the web, run code, manage files, notes and tasks, and more.</p>
        <div class="chips" id="chips"></div>
      </div>
    </div>

    <form class="composer" id="composer">
      <button type="button" class="icon" id="add-folder" aria-label="Upload a folder for LIA to read" title="Upload a folder">📁</button>
      <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
      <textarea id="input" rows="1" placeholder="Message LIA…  (Enter to send, Shift+Enter for new line)" aria-label="Message"></textarea>
      <button type="button" class="icon" id="mic" aria-label="Voice input" title="Voice input">🎤</button>
      <button type="submit" class="btn primary" id="send">Send</button>
      <button type="button" class="btn danger" id="stop" hidden>Stop</button>
    </form>
  </section>
</div>

<script src="/static/console/console.js?v=1"></script>
</body>
</html>
